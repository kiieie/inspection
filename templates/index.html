<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Inspection Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body {
            background-color: #111827;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }

        .viewer-container {
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .viewer-content {
            transform-origin: 0 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Utility */
        .text-xxs {
            font-size: 0.65rem;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef, useMemo } = React;

        // Inline SVG Icons
        const ZoomIn = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" /></svg>;
        const ZoomOut = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg>;
        const Activity = ({ size = 24, className }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>;
        const CheckCircle = ({ size = 24, className }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>;

        function App() {
            const [results, setResults] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [stats, setStats] = useState({ total: 0, fail: 0, last: "-" });
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            const viewerRef = useRef(null);
            const imgRef = useRef(null);

            // Fetch Data
            const fetchData = async () => {
                try {
                    const res = await fetch("/api/latest-results?limit=100");
                    const data = await res.json();
                    setResults(data);

                    const failCount = data.filter(r => r.judgement === "FAIL").length;
                    setStats({
                        total: data.length,
                        fail: failCount,
                        last: data.length > 0 ? data[0].inspection_datetime.split(" ")[1] : "-"
                    });

                    // Initial Selection ONLY (No Auto-Update afterwards)
                    // This fixes the "2-second revert" issue
                    /*
                    if (data.length > 0 && selectedId === null) {
                         setSelectedId(data[0].id);
                    }
                    */
                    // Actually, if we don't set it, viewer is empty.
                    // But if we set it, use effect might trigger?
                    // Let's set it only on very first load (results.length was 0 before)
                } catch (e) { console.error(e); }
            };

            // Setup polling
            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 2000);
                return () => clearInterval(interval);
            }, []);

            // Set initial selection once data arrives
            useEffect(() => {
                if (results.length > 0 && selectedId === null) {
                    setSelectedId(results[0].id);
                }
            }, [results.length]); // Only depend on length change (0 -> N)

            const selectedRow = useMemo(() =>
                results.find(r => r.id === selectedId) || null,
                [results, selectedId]
            );

            // Zoom logic similar to before...
            const resetZoom = () => setTransform({ x: 0, y: 0, scale: 1 });

            // On selection change, auto-center on box
            useEffect(() => {
                if (selectedRow && selectedRow.spatial_info && selectedRow.spatial_info.box) {
                    const [x1, y1, x2, y2] = selectedRow.spatial_info.box;
                    if (x1 === 0 && x2 === 0) { resetZoom(); return; }

                    if (viewerRef.current) {
                        const { width, height } = viewerRef.current.getBoundingClientRect();
                        const boxW = x2 - x1;
                        const centerX = x1 + boxW / 2;
                        const centerY = y1 + (y2 - y1) / 2;

                        let targetScale = boxW < 200 ? 2.5 : 1.5;
                        const targetX = (width / 2) - (centerX * targetScale);
                        const targetY = (height / 2) - (centerY * targetScale);
                        setTransform({ x: targetX, y: targetY, scale: targetScale });
                    }
                } else {
                    resetZoom();
                }
            }, [selectedId]);

            // Mouse handlers...
            const handleWheel = (e) => {
                e.preventDefault();
                const scaleAmount = -e.deltaY * 0.001;
                setTransform(p => ({ ...p, scale: Math.min(Math.max(0.1, p.scale + scaleAmount), 10) }));
            };
            const handleMouseDown = (e) => { setIsDragging(true); setDragStart({ x: e.clientX - transform.x, y: e.clientY - transform.y }); };
            const handleMouseMove = (e) => { if (isDragging) setTransform(p => ({ ...p, x: e.clientX - dragStart.x, y: e.clientY - dragStart.y })); };
            const handleMouseUp = () => setIsDragging(false);

            const triggerTask = async () => { await fetch("/api/push-task", { method: "POST" }); fetchData(); };

            return (
                <div className="flex flex-col h-screen overflow-hidden text-gray-100">
                    {/* Header */}
                    <header className="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-gray-900 border-b border-gray-800 z-10 shrink-0">
                        <div className="flex items-center gap-3">
                            <Activity className="text-emerald-400" />
                            <h1 className="font-bold tracking-tight text-white">AI Inspection Dashboard</h1>
                        </div>
                        <div className="flex gap-4 text-xs font-mono">
                            <div>Total: {stats.total}</div>
                            <div>Fail: <span className="text-red-400">{stats.fail}</span></div>
                            <div>Last: {stats.last}</div>
                            <button onClick={triggerTask} className="bg-emerald-700 px-3 py-1 rounded hover:bg-emerald-600 transition">Inject</button>
                        </div>
                    </header>

                    {/* Main Layout: 2:1 Ratio */}
                    <div className="flex-1 flex overflow-hidden">

                        {/* Left: Image Viewer (Flex 2 = 66%) */}
                        <div className="flex-[2] bg-black relative flex flex-col border-r border-gray-800">
                            <div
                                className="viewer-container flex-1 cursor-move"
                                ref={viewerRef}
                                onWheel={handleWheel}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                            >
                                {selectedRow && selectedRow.raw_img_url ? (
                                    <div
                                        className="viewer-content absolute top-0 left-0"
                                        style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})` }}
                                    >
                                        <img ref={imgRef} src={selectedRow.raw_img_url} draggable={false} className="pointer-events-none block max-w-none" />
                                        {selectedRow.spatial_info && selectedRow.spatial_info.box && (
                                            <div
                                                className="absolute border-[3px] border-yellow-400 bg-yellow-400/20 shadow-[0_0_20px_rgba(250,204,21,0.6)] z-10"
                                                style={{
                                                    left: selectedRow.spatial_info.box[0],
                                                    top: selectedRow.spatial_info.box[1],
                                                    width: selectedRow.spatial_info.box[2] - selectedRow.spatial_info.box[0],
                                                    height: selectedRow.spatial_info.box[3] - selectedRow.spatial_info.box[1]
                                                }}
                                            />
                                        )}
                                    </div>
                                ) : (
                                    <div className="flex h-full items-center justify-center text-gray-500">Waiting for data...</div>
                                )}
                            </div>

                            {/* Controls */}
                            <div className="absolute bottom-4 right-4 flex gap-2">
                                <button onClick={() => setTransform(p => ({ ...p, scale: p.scale + 0.2 }))} className="bg-gray-800/80 p-2 rounded text-white border border-gray-600"><ZoomIn size={18} /></button>
                                <button onClick={() => setTransform(p => ({ ...p, scale: Math.max(0.1, p.scale - 0.2) }))} className="bg-gray-800/80 p-2 rounded text-white border border-gray-600"><ZoomOut size={18} /></button>
                                <button onClick={resetZoom} className="bg-gray-800/80 px-3 py-2 rounded text-xs border border-gray-600">Reset</button>
                            </div>
                        </div>

                        {/* Right: Inspection List (Flex 1 = 33%) */}
                        <div className="flex-1 bg-gray-900 flex flex-col min-w-[300px]">
                            <div className="p-3 border-b border-gray-800 bg-gray-900/90 font-semibold text-sm flex items-center gap-2">
                                <CheckCircle size={16} className="text-emerald-500" /> Results List
                            </div>
                            <div className="flex-1 overflow-y-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-gray-800 text-xs text-gray-400 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-3 py-2">Loc / Name</th>
                                            <th className="px-3 py-2 text-center">Value</th>
                                            <th className="px-3 py-2 text-right">State</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm divide-y divide-gray-800">
                                        {results.map(r => (
                                            <tr
                                                key={r.id}
                                                onClick={() => setSelectedId(r.id)}
                                                className={`cursor-pointer hover:bg-gray-800/50 transition-colors ${selectedId === r.id ? "bg-emerald-900/20 border-l-2 border-emerald-500" : "border-l-2 border-transparent"}`}
                                            >
                                                <td className="px-3 py-2">
                                                    <div className="text-xs text-gray-400 w-24 truncate">{r.facility_2} - {r.inspection_point_type}</div>
                                                    <div className="text-gray-200 font-medium truncate w-32" title={r.inspection_name}>{r.inspection_name}</div>
                                                </td>
                                                <td className="px-3 py-2 text-center align-middle">
                                                    <div className="text-gray-300 font-mono truncate max-w-[100px] mx-auto text-xs bg-gray-800 rounded px-1 py-0.5" title={r.result_value}>
                                                        {r.result_value}
                                                    </div>
                                                </td>
                                                <td className="px-3 py-2 text-right">
                                                    {r.judgement === "PASS" ?
                                                        <span className="text-emerald-400 text-xs font-bold bg-emerald-400/10 px-1.5 py-0.5 rounded">PASS</span> :
                                                        <span className="text-red-400 text-xs font-bold bg-red-400/10 px-1.5 py-0.5 rounded">FAIL</span>
                                                    }
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>

</html>
